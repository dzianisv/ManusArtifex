[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robohand"
version = "0.1.0"
description = "Control library and CLI for the Hiwonder/LewanSoul LeArm (xArm 1S, LSC-6) 6-DOF robotic arm"
readme = "docs/robohand.md"
requires-python = ">=3.9"
dependencies = [
    "hidapi>=0.14",
]

# The Gemini locator backend is optional: robohand.locate degrades to
# LocatorUnavailable and the classical/sim backends keep working without it.
# It is an extra rather than a hard dependency so a plain install stays small,
# but the locator's tests do exercise the real payload construction, so it must
# be installed to run the full suite.
[project.optional-dependencies]
gemini = ["google-genai>=1.0"]

[project.scripts]
robohand = "robohand.cli:main"

[tool.setuptools]
packages = ["robohand"]

[tool.setuptools.package-data]
robohand = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# This venv has a stray global "agentprobe" pytest11 entry point (from an unrelated
# tool installed in the same environment) whose module is not actually importable,
# which otherwise aborts collection before any robohand test can run. Disabling it
# here is scoped to this repo's test runs only and does not touch the venv itself.
addopts = "-p no:agentprobe"
